<app-modal title="Nova organização" subtitle="Agrupe pessoas para compartilhar JSONs." icon="add_business">
  <form id="addOrgForm" [formGroup]="sendForm" (ngSubmit)="send()" novalidate>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nome da organização</mat-label>
      <input formControlName="name" matInput maxlength="100" placeholder="Ex.: Time de Backend" autocomplete="off" cdkFocusInitial>
      <mat-hint align="end">{{ sendForm.get('name').value?.length || 0 }}/100</mat-hint>
      @if (sendForm.get('name').hasError('required')) {
        <mat-error>Informe o nome da organização.</mat-error>
      }
    </mat-form-field>
  </form>
  <ng-container modal-actions>
    <button mat-button type="button" matDialogClose>Cancelar</button>
    <button mat-flat-button class="primary-action" type="submit" form="addOrgForm" [disabled]="sending">
      @if (sending) { <mat-spinner class="btn-spinner" diameter="16"></mat-spinner> }
      {{ sending ? 'Criando…' : 'Criar' }}
    </button>
  </ng-container>
</app-modal>
