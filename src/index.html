<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>JSONEdit — Editor e formatador de JSON</title>
  <meta name="description" content="Editor, formatador e validador de JSON online e desktop. Visualize em árvore ou gráfico, compartilhe por link e edite em tempo real com sua equipe.">
  <meta name="theme-color" content="#6C5CE7">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Aplica o tema antes do Angular carregar para evitar a "piscada" branca.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('settings') || 'null');
        var dark = s ? !!s.dark_mode : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark-theme');
      } catch (e) {}
    })();
  </script>
</head>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-W92ZHVBQ0C');
  </script>
</body>
</html>
